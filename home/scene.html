  c = mix(c, studio(R), clamp(fresnel * 0.95 + 0.07, 0.0, 1.0));
  c *= 1.0 - 0.28 * (1.0 - smoothstep(0.0, 0.12, ti));
  c *= 1.0 + 0.02 * sin(p.x / uRes.x * 3.4 + 0.7);
  return c;
}

// the room seen through the glass window
vec3 windowAt(vec2 frag, float dw, float scale, float foot, bool bent) {
  vec3 c = bent ? worldBent(frag, scale, foot) : worldExact(frag);
  vec2 uv = clamp(worldPos(frag) / uWorldSize, 0.0, 1.0);
  vec3 bl = textureLod(uWorld, uv, 2.6).rgb;
  float lum = dot(bl, vec3(0.299, 0.587, 0.114));
  c += bl * smoothstep(0.42, 0.9, lum) * uGlow;
  float ink = clamp(exp(dw / (uBezel * 0.6)) * 0.42, 0.0, 0.7);
  c = mix(c, uInk, ink);
  vec2 q = frag - (uWin.xy + 0.5 * uWin.zw);
  float sheen = smoothstep(uWin.w * 0.05, uWin.w * 0.5, q.y + q.x * 0.07);
  c = mix(c, uEnvHi, sheen * sheen * 0.07);
  return c;
}

vec3 sceneAt(vec2 frag, float scale, float foot, bool bent) {
  vec2 q = frag - (uWin.xy + 0.5 * uWin.zw);
  float dw = rb(q, 0.5 * uWin.zw, uWinR);
  if (dw > 1.0) return frameAt(frag);
  vec3 w = windowAt(frag, dw, scale, foot, bent);
  if (dw < -1.0) return w;
  return mix(w, frameAt(frag), smoothstep(-1.0, 1.0, dw));
}

void main() {
  vec2 frag = gl_FragCoord.xy;
  vec2 p = frag - 0.5 * uRes;
  float alpha = 1.0 - smoothstep(-0.8, 0.8, rb(p, 0.5 * uRes, uCorner));
  if (alpha <= 0.0) { outColor = vec4(0.0); return; }
  vec3 color = sceneAt(frag, uK, 1.0, false);

  vec2 lq = frag - uLens.xy;
  if (uWobble > 0.001) {
    lq += uWobble * uLens.w * 0.012 * vec2(sin(lq.y / uLens.w * 7.0 + uTime * 11.0), sin(lq.x / uLens.w * 6.0 - uTime * 9.0));
  }
  vec2 he = uLens.zw;
  float lr = uLensR;
  float ld = rb(lq, he, lr);
  float h = he.y;

  // the lens drops a soft shadow on the window
  if (ld > -0.8) {
    float sd = rb(lq + vec2(0.0, -h * (0.05 + 0.035 * uLift)), he, lr);
    float shA = (1.0 - smoothstep(-h * 0.14, h * (0.2 + 0.1 * uLift), sd)) * 0.36;
    color = uInk * shA + color * (1.0 - shA);
  }

  if (ld < 1.0) {
    vec2 gr = rbGrad(lq, he, lr);
    float span = min(he.x, he.y);
    float rim = 1.0 - clamp(-ld / span, 0.0, 1.0);

    // flat, slightly magnified centre; the rim bends hard and compresses what is outside
    float mag = 1.3 + 0.04 * uLift;
    float bt = clamp((rim - 0.64) / 0.36, 0.0, 1.0);
    float band = bt * bt * (3.0 - 2.0 * bt);
    float strength = 0.46;
    vec2 seenAt = uLens.xy + lq / mag;
    vec2 shift = gr * pow(band, 2.2) * span * strength;
    float slopeBand = 6.0 * bt * (1.0 - bt) / 0.36;
    float foot = (1.0 / mag + 2.2 * pow(max(band, 1.0e-3), 1.2) * slopeBand * strength) / uK;
    float scale = uK * mag;
    vec3 seen;
    if (band > 0.02) {
      float ca = 0.075 * band;
      seen.r = sceneAt(seenAt + shift * (1.0 - ca), scale, foot, true).r;
      seen.g = sceneAt(seenAt + shift, scale, foot, true).g;
      seen.b = sceneAt(seenAt + shift * (1.0 + ca), scale, foot, true).b;
    } else {
      seen = sceneAt(seenAt, scale, foot, true);
    }

    float slope = 0.24 * rim + 0.76 * pow(rim, 6.0);
    vec2 tilt = gr * slope;
    vec3 N = normalize(vec3(tilt, sqrt(max(1.0 - dot(tilt, tilt), 0.02))));
    vec3 R = vec3(2.0 * N.z * N.xy, 2.0 * N.z * N.z - 1.0);
    vec2 lp = lq / he;

    vec3 lens = seen * 1.04;
    lens = mix(lens, uInk, pow(rim, 13.0) * 0.4);
    float pool = smoothstep(0.1, 0.96, -lp.y) * smoothstep(1.0, 0.84, rim) * smoothstep(0.38, 0.8, rim);
    lens += uEnvHi * pool * 0.22;
    float broad = softBox(lp + vec2(0.0, lp.x * lp.x * 0.16), vec2(-0.04, 0.68), vec2(0.6, 0.14), 0.2) * smoothstep(0.98, 0.76, rim);
    lens = mix(lens, uEnvHi, broad * 0.4);
    float fresnel = pow(1.0 - N.z, 3.0);
    float dirLight = 0.25 + 0.75 * smoothstep(-0.7, 0.85, dot(gr, normalize(vec2(-0.35, 0.94))));
    lens = mix(lens, studio(R), clamp(fresnel * dirLight * dirLight * 0.8, 0.0, 0.58));
    float lineW = max(1.1, h * 0.0052 * 3.0);
    float hair = 1.0 - smoothstep(0.0, lineW, abs(ld + lineW * 1.15));
    float arcA = pow(max(dot(gr, normalize(vec2(-0.5, 0.86))), 0.0), 2.4);
    float arcB = pow(max(dot(gr, normalize(vec2(0.58, -0.82))), 0.0), 3.4) * 0.42;
    lens = mix(lens, uEnvHi, hair * clamp(arcA + arcB, 0.0, 1.0) * 0.92);

    float cover = 1.0 - smoothstep(-0.8, 0.8, ld);
    color = mix(color, lens, cover);
  }

  float n = fract(sin(dot(frag, vec2(12.9898, 78.233))) * 43758.5453);
  n += fract(sin(dot(frag, vec2(93.989, 67.345))) * 24634.6345) - 1.0;
  color += (n * 0.75) / 255.0;
  outColor = vec4(clamp(color, 0.0, 1.0) * alpha, alpha);
}`;

  const shape = { W: 1, H: 1, dpr: 1, k: 3, wx: 0, wy: 0, ww: 1, wh: 1, corner: 1, winR: 1, bezel: 1, lensH: 1 };
  let gl = null;
  let ready = false;
  let program = null;
  let vao = null;
  let quad = null;
  let texWorld = null;
  const loc = {};
  let ctx2d = null;
  let lowCanvas = null;

  const compile = (type, source) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || "shader");
    return s;
  };
  const setupGl = () => {
    try {
      gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false });
    } catch {
      gl = null;
    }
    if (!gl) return false;
    try {
      program = gl.createProgram();
      const v = compile(gl.VERTEX_SHADER, VERT);
      const f = compile(gl.FRAGMENT_SHADER, FRAG);
      gl.attachShader(program, v);
      gl.attachShader(program, f);
      gl.bindAttribLocation(program, 0, "aPos");
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || "link");
    } catch (err) {
      console.warn("home: shader failed, falling back to 2D", err);
      return false;
    }
    gl.useProgram(program);
    for (const name of ["uWorld", "uRes", "uWorldSize", "uShift", "uWin", "uLens", "uK", "uCorner", "uBezel", "uWinR", "uLensR", "uLift", "uWobble", "uTime", "uGlow", "uAlbedo", "uEnvHi", "uEnvLo", "uInk", "uGround"]) {
      loc[name] = gl.getUniformLocation(program, name);
    }
    vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    texWorld = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texWorld);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, WW, WH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.uniform1i(loc.uWorld, 0);
    gl.disable(gl.BLEND);
    return true;
  };
  const useCanvas2d = () => {
    const fresh = canvas.cloneNode(false);
    canvas.replaceWith(fresh);
    canvas = fresh;
    ctx2d = canvas.getContext("2d");
    lowCanvas = document.createElement("canvas");
    lowCanvas.width = WW;
    lowCanvas.height = WH;
  };
  ready = setupGl();
  if (!ready) useCanvas2d();

  // lens geometry in device pixels (gl origin: bottom-left)
  const lensGeom = () => {
    const s = clamp(stretch, -0.5, 1.2);
    const hx = shape.lensH * (1 + 0.03 * lift) * (1 + 0.22 * s);
    const hy = shape.lensH * (1 + 0.03 * lift) * (1 - 0.08 * s);
    const mx = hx * 0.55;
    const my = hy * 0.55;
    const cx = shape.wx + mx + clamp(x) * (shape.ww - 2 * mx);
    const cy = shape.wy + my + clamp(y) * (shape.wh - 2 * my);
    return { hx, hy, cx, cy, mx, my };
  };

  const measure = () => {
    // layout size, not getBoundingClientRect: a host may scale us with a CSS transform
    const dpr = Math.min(2, devicePixelRatio || 1);
    const W = Math.max(2, Math.round((root.offsetWidth || 360) * dpr));
    const H = Math.max(2, Math.round((root.offsetHeight || 360) * dpr));
    shape.dpr = dpr;
    shape.W = W;
    shape.H = H;
    const k = Math.max(1, Math.floor((Math.min(W, H) - 24 * dpr) / WW));
    shape.k = k;
    shape.ww = WW * k;
    shape.wh = WH * k;
    shape.wx = Math.floor((W - shape.ww) / 2);
    // a little more room under the window for the readout
    shape.wy = Math.floor((H - shape.wh) / 2) - Math.round(3 * dpr);
    shape.bezel = (W - shape.ww) / 2;
    shape.corner = 28 * dpr;
    shape.winR = 10 * dpr;
    shape.lensH = shape.wh * 0.145;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = `${W / dpr}px`;
    canvas.style.height = `${H / dpr}px`;
    pad.style.left = `${shape.wx / dpr}px`;
    pad.style.top = `${(H - (shape.wy + shape.wh)) / dpr}px`;
    pad.style.width = `${shape.ww / dpr}px`;
    pad.style.height = `${shape.wh / dpr}px`;
    pad.style.borderRadius = `${shape.winR / dpr}px`;
    if (ready) gl.viewport(0, 0, W, H);
    dirty = true;
  };

  const drawGl = (time) => {
    gl.bindVertexArray(vao);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(program);
    const lens = lensGeom();
    gl.uniform2f(loc.uRes, shape.W, shape.H);
    gl.uniform2f(loc.uWorldSize, WW, WH);
    gl.uniform2f(loc.uShift, shiftX, shiftY);
    gl.uniform4f(loc.uWin, shape.wx, shape.wy, shape.ww, shape.wh);
    gl.uniform4f(loc.uLens, lens.cx, lens.cy, lens.hx, lens.hy);
    gl.uniform1f(loc.uK, shape.k);
    gl.uniform1f(loc.uCorner, shape.corner);
    gl.uniform1f(loc.uBezel, shape.bezel);
    gl.uniform1f(loc.uWinR, shape.winR);
    gl.uniform1f(loc.uLensR, Math.min(lens.hx, lens.hy) * 0.82);
    gl.uniform1f(loc.uLift, lift);
    gl.uniform1f(loc.uWobble, calm ? 0 : wobble);
    gl.uniform1f(loc.uTime, time % 1000);
    gl.uniform1f(loc.uGlow, mix(0.62, 0.1, smoothstep(0.1, 0.85, y)));
    gl.uniform3fv(loc.uAlbedo, body.albedo);
    gl.uniform3fv(loc.uEnvHi, body.hi);
    gl.uniform3fv(loc.uEnvLo, body.lo);
    gl.uniform3fv(loc.uGround, body.ground);
    gl.uniform3fv(loc.uInk, unit(pal(RK, 0)));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };

  const uploadWorld = () => {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texWorld);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, WW, WH, gl.RGBA, gl.UNSIGNED_BYTE, pixelBytes);
    gl.generateMipmap(gl.TEXTURE_2D);
  };

  // WebGL unavailable: the frame, the window, and a plainly magnified lens
  const cssColor = (c, a = 1) => `rgb(${c.map((v) => Math.round(v * 255)).join(" ")} / ${a})`;
  const draw2d = () => {
    const g = ctx2d;
    const low = lowCanvas.getContext("2d");
    low.putImageData(new ImageData(new Uint8ClampedArray(pixels.buffer.slice(0)), WW, WH), 0, 0);
    g.clearRect(0, 0, shape.W, shape.H);
    g.fillStyle = cssColor(body.albedo);
    g.beginPath();
    g.roundRect(0, 0, shape.W, shape.H, shape.corner);
    g.fill();
    const top = shape.H - (shape.wy + shape.wh);
    g.save();
    g.beginPath();
    g.roundRect(shape.wx, top, shape.ww, shape.wh, shape.winR);
    g.clip();
    g.imageSmoothingEnabled = false;
    g.drawImage(lowCanvas, shape.wx + shiftX * shape.k, top + shiftY * shape.k, shape.ww, shape.wh);
    g.restore();
    const lens = lensGeom();
    const cy = shape.H - lens.cy;
    const path = () => {
      g.beginPath();
      g.roundRect(lens.cx - lens.hx, cy - lens.hy, lens.hx * 2, lens.hy * 2, Math.min(lens.hx, lens.hy) * 0.82);
    };
    g.save();
    path();
    g.clip();
    g.translate(lens.cx, cy);
    g.scale(1.3, 1.3);
    g.translate(-lens.cx, -cy);
    g.drawImage(lowCanvas, shape.wx + shiftX * shape.k, top + shiftY * shape.k, shape.ww, shape.wh);
    g.restore();
    g.strokeStyle = cssColor(body.hi, 0.9);
    g.lineWidth = Math.max(1, shape.dpr * 1.5);
    path();
    g.stroke();
  };

  // ---------------------------------------------------------------- loop
  let raf = 0;
  let last = 0;
  let worldAcc = 1;
  let dirty = true;
  let worldDirty = true;
  let booted = false;

  const tick = (ms) => {
    raf = 0;
    if (!root.isConnected) return;
    const t = ms / 1000;
    const dt = last ? Math.min(0.05, t - last) : 1 / 60;
    last = t;

    const tx = value / 100;
    const ty = bright / 100;
    if (calm) {
      if (x !== tx || y !== ty) {
        x = tx;
        y = ty;
        worldDirty = true;
        dirty = true;
      }
      vx = vy = stretch = stretchV = 0;
      lift = liftTarget;
    } else {
      const omega = 24;
      const decay = Math.exp(-omega * dt);
      const follow = (cur, vel, target) => {
        const away = cur - target;
        const carry = (vel + omega * away) * dt;
        return [target + (away + carry) * decay, (vel - omega * carry) * decay];
      };
      [x, vx] = follow(x, vx, tx);
      [y, vy] = follow(y, vy, ty);
      if (Math.abs(tx - x) < 0.0002 && Math.abs(vx) < 0.002) {
        x = tx;
        vx = 0;
      }
      if (Math.abs(ty - y) < 0.0002 && Math.abs(vy) < 0.002) {
        y = ty;
        vy = 0;
      }
      const speed = Math.hypot(vx, vy);
      const goal = clamp(speed * 0.5);
      const sdt = Math.min(dt, 1 / 40);
      stretchV += (190 * (goal - stretch) - 12 * stretchV) * sdt;
      stretch += stretchV * sdt;
      lift += (liftTarget - lift) * (1 - Math.exp(-dt * 14));
      wobble = Math.max(wobble * Math.exp(-dt * 3.4), clamp(speed * 0.9));
      dirty = true; // the room is alive: always redraw
    }
    lensWx = (lensGeom().cx - shape.wx) / shape.k;

    worldAcc += dt;
    if (calm ? worldDirty : worldAcc >= 1 / WORLD_HZ - 0.004) {
      stepWorld(Math.min(worldAcc, 0.1));
      renderWorld();
      worldAcc = 0;
      worldDirty = false;
      if (ready) uploadWorld();
      dirty = true;
    }
    if (dirty) {
      if (ready) drawGl(t);
      else if (ctx2d) draw2d();
      dirty = false;
    }
    wake();
  };
  const wake = () => {
    if (raf || !booted || !root.isConnected || document.visibilityState === "hidden") return;
    if (calm && !dirty && !worldDirty && Math.abs(x - value / 100) < 1e-6 && Math.abs(y - bright / 100) < 1e-6) return;
    raf = requestAnimationFrame(tick);
  };
  const touch = () => {
    worldDirty = true;
    dirty = true;
    last = 0;
    wake();
  };

  // ---------------------------------------------------------------- Control bridge
  const ctl = () => window.Control;
  let sendTimer = 0;
  let sentVol = -1;
  let sentBri = -1;
  const safe = (p) => Promise.resolve(p).catch((err) => console.error(err));
  const flush = () => {
    sendTimer = 0;
    const c = ctl();
    if (!c) return;
    if (value !== sentVol) {
      sentVol = value;
      safe(c.setVolume(value));
    }
    if (briAvailable && bright !== sentBri) {
      sentBri = bright;
      safe(c.setBrightness(bright));
    }
  };
  const queueSend = (now) => {
    if (now) {
      clearTimeout(sendTimer);
      flush();
    } else if (!sendTimer) sendTimer = setTimeout(flush, 33);
  };

  // ---------------------------------------------------------------- sound
  // Web Audio synthesis, no assets. One soft blip per volume step while
  // dragging; gain and brightness of the tone follow the volume, so the
  // sound gets louder and sharper the higher you drag.
  let actx = null;
  let soundOn = true; // a scene may switch this off; see Sound.off
  const Sound = (() => {
    const tone = (level01) => {
      if (!soundOn) return;
      // A bad level must not corrupt AudioParam scheduling (it throws on NaN).
      if (!Number.isFinite(level01)) return;
      try {
        if (!actx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          actx = new AC();
        }
        if (actx.state === "suspended") actx.resume();
        const t = actx.currentTime;
        const now = actx.currentTime;
        const v = clamp(level01);
        // Louder + brighter with volume: gain 0.02→0.16, lowpass 900→7000 Hz.
        const gain = 0.02 + v * 0.14;
        const cut = 900 + v * 6100;
        const osc = actx.createOscillator();
        const lp = actx.createBiquadFilter();
        const amp = actx.createGain();
        osc.type = v > 0.75 ? "triangle" : "sine";
        osc.frequency.setValueAtTime(320 + v * 520, t);
        lp.type = "lowpass";
        lp.frequency.setValueAtTime(cut, t);
        lp.Q.value = 0.7;
        amp.gain.setValueAtTime(0, t);
        amp.gain.linearRampToValueAtTime(gain, t + 0.004);
        amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.07 + v * 0.05);
        osc.connect(lp);
        lp.connect(amp);
        amp.connect(actx.destination);
        osc.start(now);
        osc.stop(now + 0.16 + v * 0.05);
        osc.onended = () => {
          osc.disconnect();
          lp.disconnect();
          amp.disconnect();
        };
      } catch (err) {
        // Audio is decoration; never let it break the control.
        console.error(err);
      }
    };
    let lastAt = 0;
    // A WebView keeps audio locked until a real gesture; the first blip
    // happens inside a pointerdown handler, so creating the context there
    // is enough and calling resume() on a fresh context is harmless.
    return {
      // One blip when the volume lands on a new value; a fast drag would
      // otherwise turn into a buzz, so keep a floor between blips.
      step(level) {
        const now = performance.now();
        if (now - lastAt < 45) return;
        lastAt = now;
        tone(level);
      },
      // A muted click when the drag starts, at the current level.
      press: (level) => tone(clamp(level) * 0.6),
      off() {
        soundOn = false;
      },
    };
  })();

  const paintHud = () => {
    readoutEl.textContent = `VOL ${value} · BRI ${bright}`;
    pad.setAttribute("aria-label", `pad. ${describe()}`);
  };
  const setValues = (vol, bri, fromUI) => {
    const nv = Math.round(clamp(vol, 0, 100));
    const nb2 = LOCK_Y_WHEN_UNAVAILABLE && !briAvailable ? bright : Math.round(clamp(bri, 0, 100));
    if (nv === value && nb2 === bright) return;
    const volMoved = nv !== value;
    value = nv;
    bright = nb2;
    paintHud();
    if (fromUI) {
      // The pad sings: each new volume step blips, louder as it climbs.
      if (volMoved) Sound.step(value / 100);
      queueSend(false);
    }
    touch();
  };

  // ---------------------------------------------------------------- input
  let dragging = false;
  const fromPointer = (cx, cy) => {
    const r = pad.getBoundingClientRect();
    const lens = lensGeom();
    const zoom = r.width / Math.max(1, pad.offsetWidth); // host transform scale
    const mx = (lens.mx / shape.dpr) * zoom;
    const my = (lens.my / shape.dpr) * zoom;
    const xn = clamp((cx - (r.left + mx)) / Math.max(1, r.width - 2 * mx));
    const yn = clamp((cy - (r.top + my)) / Math.max(1, r.height - 2 * my));
    setValues(xn * 100, (1 - yn) * 100, true);
  };
  pad.addEventListener("pointerdown", (e) => {
    dragging = true;
    pad.classList.add("dragging");
    pad.setPointerCapture(e.pointerId);
    liftTarget = 1;
    safe(ctl()?.noteDrag(true));
    Sound.press(value / 100);
    fromPointer(e.clientX, e.clientY);
    touch();
  });
  pad.addEventListener("pointermove", (e) => {
    if (dragging) fromPointer(e.clientX, e.clientY);
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    pad.classList.remove("dragging");
    liftTarget = 0;
    queueSend(true);
    safe(ctl()?.noteDrag(false));
    safe(ctl()?.noteIdle());
    touch();
  };
  pad.addEventListener("pointerup", endDrag);
  pad.addEventListener("pointercancel", endDrag);
  pad.addEventListener("lostpointercapture", endDrag);
  pad.addEventListener("keydown", (e) => {
    const step = e.shiftKey ? 5 : 1;
    let handled = true;
    if (e.key === "ArrowLeft") setValues(value - step, bright, true);
    else if (e.key === "ArrowRight") setValues(value + step, bright, true);
    else if (e.key === "ArrowUp") setValues(value, bright + step, true);
    else if (e.key === "ArrowDown") setValues(value, bright - step, true);
    else handled = false;
    if (handled) e.preventDefault();
  });

  window.events?.stateChanged.on((change) => {
    if (dragging || change.source !== "external") return;
    setValues(typeof change.volume === "number" ? change.volume : value, briAvailable && typeof change.brightness === "number" ? change.brightness : bright, false);
  });

  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  reduced.addEventListener?.("change", () => {
    calm = reduced.matches;
    touch();
  });
  new ResizeObserver(() => {
    measure();
    touch();
  }).observe(root);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "hidden") touch();
  });
  canvas.addEventListener("webglcontextlost", (e) => {
    e.preventDefault();
    ready = false;
  });
  canvas.addEventListener("webglcontextrestored", () => {
    ready = setupGl();
    if (!ready) useCanvas2d();
    measure();
    touch();
  });

  // ---------------------------------------------------------------- boot
  const boot = async () => {
    try {
      const state = await ctl().getState();
      briAvailable = !!state.brightnessAvailable;
      value = Math.round(clamp(state.volume, 0, 100));
      bright = briAvailable ? Math.round(clamp(state.brightness, 0, 100)) : 50;
      sentVol = value;
      sentBri = bright;
    } catch (err) {
      console.error(err);
    }
    x = value / 100;
    y = bright / 100;
    paintHud();
    buildBase();
    measure();
    actor.mode = wantMode();
    actor.x = seatedMode(actor.mode) ? SOFA_X : DANCE_X;
    nb.light = y < 0.25 ? 0.25 : 1;
    lampNow = y < 0.62 ? 1 : 0;
    party = smoothstep(0.72, 0.78, x);
    ballDrop = party > 0.02 ? 1 : 0;
    for (let i = 0; i < 90; i++) stepWorld(1 / 30);
    renderWorld();
    if (ready) uploadWorld();
    booted = true;
    touch();
  };
  boot();
})();
</script>
